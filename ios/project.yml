name: cLaudeRC
options:
  bundleIdPrefix: life.mygig
  deploymentTarget:
    iOS: "16.0"
packages:
  NIOSSH:
    url: https://github.com/apple/swift-nio-ssh
    from: 0.8.0
  NIO:
    url: https://github.com/apple/swift-nio
    from: 2.65.0
targets:
  cLaudeRC:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: NIOSSH
        product: NIOSSH
      - package: NIO
        product: NIOCore
      - package: NIO
        product: NIOPosix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.mygig.clauderc
        PRODUCT_NAME: cLaudeRC
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: cLaudeRC
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connects to your server over SSH.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
