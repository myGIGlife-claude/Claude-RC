name: build

on:
  # Branch pushes only build on main (and tags); pull requests build once.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q jq tmux shellcheck openssh-server gnupg
      - name: shellcheck
        run: shellcheck -S warning server/*.sh server/claude-launcher-api server/claude-backup server/tests/*.sh server/tests/stubs/*
      - name: API tests (stub gh/claude/aws)
        run: server/tests/test-api.sh
      - name: Backup / restore tests (throwaway HOME and GNUPGHOME)
        run: bash server/tests/test-backup.sh
      - name: Real sshd + forced command
        run: sudo server/tests/test-sshd.sh

  android:
    runs-on: ubuntu-latest
    # Nothing is built or released unless the server tests pass too.
    needs: [secrets-scan, server]
    outputs:
      name: ${{ steps.ver.outputs.name }}
    env:
      # Signed on pushes to this repo only (never for pull requests).
      HAS_SIGNING: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.SIGNING_KEYSTORE_BASE64 != '' }}
      # main and tags must be signed with the release key (a missing secret FAILS the build instead of publishing a debug-signed
      # APK); pull requests are signed with the committed debug keystore and are never published.
      EXPECTED_CERT_SHA256: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'b62dd1599ca2dd7f9a637f215da28321e6ec1c45981a940e594f4595efd570f7' || 'ff714e476e95c2d2af85c31a6cc7455011ea74825f182dad9a6a74c4dc1df5c3' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Version
        id: ver
        run: |
          # versionCode only ever goes up, so each build installs over the last.
          # (It's 100 + this workflow's run number: don't rename build.yml.)
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            base="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//')"
            name="${base:-0.1.0}-build.${GITHUB_RUN_NUMBER}"
          fi
          # Tag names can hold shell characters; keep only safe ones.
          echo "name=$(tr -cd 'A-Za-z0-9._-' <<<"$name")" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Decode signing key
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          ./gradlew --no-daemon assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          mkdir -p dist
          apk=app/build/outputs/apk/release/app-release.apk
          # Several build-tools versions are installed; use the newest apksigner.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          certs="$("$apksigner" verify --print-certs "$apk")"
          echo "$certs" | head -n 3
          # A different key breaks in-place upgrades (see CLAUDE.md).
          grep -q "SHA-256 digest: $EXPECTED_CERT_SHA256" <<<"$certs" ||
            { echo "::error::APK is not signed with the expected cLaudeRC key"; exit 1; }
          cp "$apk" "dist/cLaudeRC-$VERSION_NAME.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cLaudeRC-${{ steps.ver.outputs.name }}
          path: dist/*.apk

  # Publishing is its own job so that code from a pull request (Gradle scripts, tests) never runs with a write token.
  publish:
    runs-on: ubuntu-latest
    needs: android
    if: github.event_name == 'push'
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cLaudeRC-${{ needs.android.outputs.name }}
          path: dist

      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk --title "cLaudeRC $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Publish latest main build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.android.outputs.name }}
        run: |
          gh release delete latest-main --cleanup-tag --yes || true
          gh release create latest-main dist/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest main build ($VERSION_NAME)" \
            --notes "Built from $GITHUB_SHA. Tagged releases (v*) are the stable ones."
          # Deleting and recreating the tag can race, and GitHub then leaves the
          # release as an "untagged" draft that nobody can download. Make sure it's public.
          sleep 5
          gh release edit latest-main --draft=false --prerelease
