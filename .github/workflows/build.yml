name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q jq tmux shellcheck openssh-server
      - name: shellcheck
        run: shellcheck -S warning server/*.sh server/claude-launcher-api server/tests/*.sh server/tests/stubs/*
      - name: API tests (stub gh/claude/aws)
        run: server/tests/test-api.sh
      - name: Real sshd + forced command
        run: sudo server/tests/test-sshd.sh

  android:
    runs-on: ubuntu-latest
    # Nothing is built or released unless the server tests pass too.
    needs: [secrets-scan, server]
    permissions:
      contents: write
    env:
      # Signed on pushes to this repo only (never for pull requests).
      HAS_SIGNING: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEYSTORE_BASE64 != '' }}
      EXPECTED_CERT_SHA256: cc833ec5438cbf8089cb511ab5612ff28149f0b8a0afcb18b09b020771cf3cd1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5

      - name: Version
        id: ver
        run: |
          # versionCode only ever goes up, so each build installs over the last.
          # (It's 100 + this workflow's run number: don't rename build.yml.)
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            base="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//')"
            name="${base:-0.1.0}-build.${GITHUB_RUN_NUMBER}"
          fi
          # Tag names can hold shell characters; keep only safe ones.
          echo "name=$(tr -cd 'A-Za-z0-9._-' <<<"$name")" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Decode signing key
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          ./gradlew --no-daemon assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          mkdir -p dist
          if [[ "$HAS_SIGNING" == true ]]; then
            apk=app/build/outputs/apk/release/app-release.apk
            # Several build-tools versions are installed; use the newest apksigner.
            apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
            certs="$("$apksigner" verify --print-certs "$apk")"
            echo "$certs" | head -n 3
            # The one release key (see CLAUDE.md). A different key breaks in-place upgrades.
            grep -q "SHA-256 digest: $EXPECTED_CERT_SHA256" <<<"$certs" ||
              { echo "::error::APK is not signed with the cLaudeRC release key"; exit 1; }
            cp "$apk" "dist/cLaudeRC-$VERSION_NAME.apk"
          else
            echo "::warning::Signing secrets are not set, so the APK is unsigned and no release is published. See CLAUDE.md."
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/cLaudeRC-$VERSION_NAME-unsigned.apk"
          fi
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: cLaudeRC-${{ steps.ver.outputs.name }}
          path: dist/*.apk

      - name: Publish tag release
        if: env.HAS_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk --title "cLaudeRC $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber

      - name: Publish latest main build
        if: env.HAS_SIGNING == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          gh release delete latest-main --cleanup-tag --yes || true
          gh release create latest-main dist/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest main build ($VERSION_NAME)" \
            --notes "Built from $GITHUB_SHA. Tagged releases (v*) are the stable ones."
