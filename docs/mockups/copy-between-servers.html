<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cLaudeRC mock-up: Copy between servers</title>
<link rel="stylesheet" href="screens.css"></head><body><div class="app"><section class="scr"><header class="ctop"><button class="ib" aria-label="Back"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="ct"><b>Copy between servers</b><small>Files and folders</small></div></header>

<div class="card"><div class="ah"><b>Copying my-project</b><small>9 of 14 MB</small></div><div class="prog"><u style="width:64%"></u></div><div class="stat">Existing files with the same name are kept.</div></div>
