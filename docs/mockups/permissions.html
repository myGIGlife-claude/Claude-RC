<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cLaudeRC mock-up: Permissions sheet</title>
<link rel="stylesheet" href="screens.css"></head><body><div class="app"><section class="scr"><header class="ctop"><button class="ib" aria-label="Back"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="ct"><b>Permissions</b><small>my-project</small></div></header>
<div class="body pad"><div class="seg tabs"><button class="on" style="text-align:center">This project</button><button style="text-align:center">Just me here</button><button style="text-align:center">All projects</button></div>

<div class="lh"><h2 class="lab">Allowed</h2><button class="txt">Add rule</button></div><div class="group"><button class="rule"><code>Bash(git status:*)</code><small>Bash commands starting git status</small></button><button class="rule"><code>Read</code><small>Every Read action</small></button><button class="rule"><code>Edit(src/**)</code><small>Edit for src/**</small></button></div>
<div class="lh"><h2 class="lab">Ask first</h2><button class="txt">Add rule</button></div><div class="group"><button class="rule"><code>Bash(git push:*)</code><small>Bash commands starting git push</small></button></div>
<div class="lh"><h2 class="lab">Blocked</h2><button class="txt">Add rule</button></div><div class="group"><button class="rule"><code>Read(.env)</code><small>Read for .env</small></button></div>
